# Shared by every freeaipromptmaker server block (HTTP, staging HTTPS, production HTTPS).
# Install to /etc/nginx/snippets/freeaipromptmaker-proxy.conf.

# /api/image-to-prompt accepts images up to 8 MB.
client_max_body_size 12m;

access_log /var/log/nginx/freeaipromptmaker.access.log;
error_log  /var/log/nginx/freeaipromptmaker.error.log;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Overwrite rather than append: the API rate limiter trusts the first
# X-Forwarded-For entry, so clients must not be able to inject one.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 90s;

proxy_hide_header Cache-Control;
add_header Cache-Control $fpm_cache_control always;
add_header X-Robots-Tag $fpm_robots always;

location /api/ {
    limit_req zone=fpm_api burst=3 nodelay;
    limit_conn fpm_api_conn 2;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://freeaipromptmaker;
}

location / {
    proxy_pass http://freeaipromptmaker;
}
