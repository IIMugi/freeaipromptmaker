# HTTPS for the DNS-free staging hostname. Remove after the production cutover.
# Cert: certbot certonly --nginx -d fpm.79-76-99-237.sslip.io
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fpm.79-76-99-237.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/fpm.79-76-99-237.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fpm.79-76-99-237.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/freeaipromptmaker-proxy.conf;
}
