# freeaipromptmaker.com -> Docker container on 127.0.0.1:3100 (docker-compose.yml).
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled, `nginx -t`, reload.
# TLS: `certbot --nginx` adds the 443 listeners and the http->https redirect once DNS points here.
# www -> apex and data/redirects are handled by Next (single hop), so www is proxied too.
# The sslip.io name is a DNS-free staging hostname for the same server.

upstream freeaipromptmaker {
    server 127.0.0.1:3100;
    keepalive 16;
}

# The image API proxies a paid provider and decodes uploads: throttle it per client
# on top of the app's own 20 / 10 min limiter.
limit_req_zone  $binary_remote_addr zone=fpm_api:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=fpm_api_conn:10m;

# Next marks prerendered HTML `s-maxage=31536000` for a CDN that purges on deploy.
# Without one, serve HTML the way Vercel did; hashed assets keep their immutable header.
map $upstream_http_cache_control $fpm_cache_control {
    "~s-maxage=31536000" "public, max-age=0, must-revalidate";
    default              $upstream_http_cache_control;
}

# Keep the staging hostname out of search results.
map $host $fpm_robots {
    fpm.79-76-99-237.sslip.io "noindex, nofollow";
    default                   "";
}

server {
    listen 80;
    listen [::]:80;
    server_name freeaipromptmaker.com www.freeaipromptmaker.com fpm.79-76-99-237.sslip.io;

    # /api/image-to-prompt accepts images up to 8 MB.
    client_max_body_size 12m;

    access_log /var/log/nginx/freeaipromptmaker.access.log;
    error_log  /var/log/nginx/freeaipromptmaker.error.log;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite rather than append: the API rate limiter trusts the first
    # X-Forwarded-For entry, so clients must not be able to inject one.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    proxy_hide_header Cache-Control;
    add_header Cache-Control $fpm_cache_control always;
    add_header X-Robots-Tag $fpm_robots always;

    location /api/ {
        limit_req zone=fpm_api burst=3 nodelay;
        limit_conn fpm_api_conn 2;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://freeaipromptmaker;
    }

    location / {
        proxy_pass http://freeaipromptmaker;
    }
}
