# Production HTTPS. Install only after the certificate exists:
#   sudo certbot certonly --nginx -d freeaipromptmaker.com -d www.freeaipromptmaker.com
# www -> apex happens inside Next (single 308), so www is proxied here too.
# No http2 flag: the shared :443 socket is defined without it by the other vhosts on this host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name freeaipromptmaker.com www.freeaipromptmaker.com;

    ssl_certificate     /etc/letsencrypt/live/freeaipromptmaker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freeaipromptmaker.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/freeaipromptmaker-proxy.conf;
}
